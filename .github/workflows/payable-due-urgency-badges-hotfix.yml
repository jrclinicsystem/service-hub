name: Payable due urgency badges hotfix

on:
  push:
    paths:
      - '.github/scripts/payable_due_urgency_badges_patch.py'
      - '.github/workflows/payable-due-urgency-badges-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply payable due urgency badge patch
        run: python .github/scripts/payable_due_urgency_badges_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint changed component
        run: bunx eslint src/components/finance-staging-workspace.tsx
      - name: Production build
        run: bun run build
      - name: Commit payable due urgency badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/finance-staging-workspace.tsx
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
          else
            git commit -m "finance: add payable due urgency badges"
            git push origin main
          fi
