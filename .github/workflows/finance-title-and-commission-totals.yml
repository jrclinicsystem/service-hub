name: Finance Title and Commission Totals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finance-title-and-commission-totals.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/finance_title_and_commission_totals_patch.py

      - name: Check whitespace
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Commit feature and clean temporary files
        run: |
          rm -f .github/scripts/finance_title_and_commission_totals_patch.py .github/workflows/finance-title-and-commission-totals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/finance-staging-workspace.tsx src/components/finance-commission-payment-actions.tsx .github/scripts/finance_title_and_commission_totals_patch.py .github/workflows/finance-title-and-commission-totals.yml
          git commit -m "finance: emphasize section titles and show commission totals"
          git push origin HEAD:main
