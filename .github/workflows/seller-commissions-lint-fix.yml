name: Seller commissions lint fix

on:
  push:
    branches:
      - fix/seller-commissions-lint
    paths:
      - '.github/workflows/seller-commissions-lint-fix.yml'

permissions:
  contents: write

jobs:
  diagnose-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/seller-commissions-lint

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture lint report
        run: |
          set +e
          bun run lint > .github/seller-commissions-lint-report.txt 2>&1
          exit 0

      - name: Commit lint report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/seller-commissions-lint-report.txt
          git commit -m "chore: capture seller commissions lint report"
          git push origin HEAD:fix/seller-commissions-lint
