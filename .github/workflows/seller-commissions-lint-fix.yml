name: Seller commissions lint fix

on:
  push:
    branches:
      - fix/seller-commissions-lint
    paths:
      - '.github/workflows/seller-commissions-lint-fix.yml'

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/seller-commissions-lint

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format seller commission source files
        run: >-
          bunx prettier --write
          src/components/admin-sellers-workspace.tsx
          src/routes/admin_.vendedores.tsx
          src/components/admin-subpage-sidebar.tsx
          src/routes/admin.tsx
          src/components/admin-appointments-workspace.tsx

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin-sellers-workspace.tsx src/routes/admin_.vendedores.tsx src/components/admin-subpage-sidebar.tsx src/routes/admin.tsx src/components/admin-appointments-workspace.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format seller commissions module"
            git push origin HEAD:fix/seller-commissions-lint
          fi

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit
