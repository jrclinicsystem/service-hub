name: Finance PDF payment summary runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finance-pdf-payment-summary-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply PDF patch
        run: python .github/scripts/finance_pdf_payment_summary_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript diagnostics
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Cleanup temporary files
        run: rm .github/workflows/finance-pdf-payment-summary-runner.yml .github/scripts/finance_pdf_payment_summary_patch.py
      - name: Commit changes
        run: |
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add src/components/finance-staging-workspace.tsx .github/workflows/finance-pdf-payment-summary-runner.yml .github/scripts/finance_pdf_payment_summary_patch.py
          git commit -m "finance: enrich PDF reports with payment totals"
          git push
