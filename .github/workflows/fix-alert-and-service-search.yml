name: Fix alert and service search
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-alert-and-service-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/fix_notification_and_search_visibility.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript diagnostics
        run: bunx tsc --noEmit || true
      - name: Production build
        run: bun run build
      - name: Cleanup temp patch files
        run: rm .github/scripts/fix_notification_and_search_visibility.py .github/workflows/fix-alert-and-service-search.yml
      - name: Commit changes
        run: |
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add src/components/admin-appointments-workspace.tsx src/components/ui/dialog.tsx .github/scripts/fix_notification_and_search_visibility.py .github/workflows/fix-alert-and-service-search.yml
          git commit -m "fix: stabilize appointment alert and expose service search"
          git push
