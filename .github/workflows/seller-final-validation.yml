name: Seller final validation

on:
  push:
    branches:
      - fix/seller-commissions-lint
    paths:
      - '.github/workflows/seller-final-validation.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/seller-commissions-lint
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Capture eslint diagnostics
        run: |
          set +e
          bunx eslint . --format json > .github/seller-eslint.json 2> .github/seller-eslint.stderr
          CODE=$?
          printf 'exit_code=%s\n' "$CODE" > .github/seller-eslint-exit.txt
          wc -c .github/seller-eslint.json .github/seller-eslint.stderr .github/seller-eslint-exit.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/seller-eslint.json .github/seller-eslint.stderr .github/seller-eslint-exit.txt
          git commit -m "chore: capture eslint diagnostics"
          git push origin HEAD:fix/seller-commissions-lint
