name: Seller final validation

on:
  push:
    branches:
      - fix/seller-commissions-lint
    paths:
      - '.github/workflows/seller-final-validation.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/seller-commissions-lint
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Capture exact eslint messages
        run: |
          node --input-type=module <<'NODE'
          import { ESLint } from 'eslint';
          import { writeFileSync } from 'node:fs';
          const eslint = new ESLint();
          const files = [
            'src/components/admin-sellers-workspace.tsx',
            'src/routes/admin_.vendedores.tsx',
            'src/routes/admin.tsx',
            'src/components/admin-appointments-workspace.tsx',
          ];
          const results = await eslint.lintFiles(files);
          const report = results.map((result) => ({
            filePath: result.filePath,
            errorCount: result.errorCount,
            warningCount: result.warningCount,
            messages: result.messages.map((message) => ({
              line: message.line,
              column: message.column,
              ruleId: message.ruleId,
              severity: message.severity,
              message: message.message,
            })),
          }));
          writeFileSync('.github/seller-eslint-programmatic.json', JSON.stringify(report, null, 2));
          NODE
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/seller-eslint-programmatic.json
          git commit -m "chore: capture exact eslint messages"
          git push origin HEAD:fix/seller-commissions-lint
