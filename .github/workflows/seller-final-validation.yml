name: Seller final validation

on:
  push:
    branches:
      - fix/seller-commissions-lint
    paths:
      - '.github/workflows/seller-final-validation.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/seller-commissions-lint
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Isolate lint failures
        run: |
          set +e
          : > .github/seller-lint-by-file.txt
          for FILE in \
            src/components/admin-sellers-workspace.tsx \
            src/routes/admin_.vendedores.tsx \
            src/components/admin-subpage-sidebar.tsx \
            src/routes/admin.tsx \
            src/components/admin-appointments-workspace.tsx \
            src/routeTree.gen.ts
          do
            ./node_modules/.bin/eslint "$FILE" >/dev/null 2>&1
            CODE=$?
            printf '%s=%s\n' "$FILE" "$CODE" >> .github/seller-lint-by-file.txt
          done
          ./node_modules/.bin/eslint . >/dev/null 2>&1
          printf 'ALL=%s\n' "$?" >> .github/seller-lint-by-file.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/seller-lint-by-file.txt
          git commit -m "chore: isolate seller lint failures"
          git push origin HEAD:fix/seller-commissions-lint
