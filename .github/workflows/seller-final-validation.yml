name: Seller final validation

on:
  push:
    branches:
      - fix/seller-commissions-lint
    paths:
      - '.github/workflows/seller-final-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seller-commissions-lint
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Capture lint, build and TypeScript diagnostics
        run: |
          set +e
          bun run lint > /tmp/lint.txt 2>&1
          LINT_EXIT=$?
          bun run build > /tmp/build.txt 2>&1
          BUILD_EXIT=$?
          bunx tsc --noEmit > /tmp/tsc.txt 2>&1
          TSC_EXIT=$?
          {
            echo "LINT_EXIT=$LINT_EXIT"
            echo "BUILD_EXIT=$BUILD_EXIT"
            echo "TSC_EXIT=$TSC_EXIT"
            echo
            echo "===== LINT ====="
            cat /tmp/lint.txt
            echo
            echo "===== BUILD ====="
            cat /tmp/build.txt
            echo
            echo "===== TYPESCRIPT ====="
            cat /tmp/tsc.txt
          } > .github/seller-final-validation-report.txt
          exit 0
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/seller-final-validation-report.txt
          git commit -m "chore: capture final seller validation report"
          git push origin HEAD:fix/seller-commissions-lint
