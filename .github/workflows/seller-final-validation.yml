name: Seller final validation

on:
  push:
    branches:
      - fix/seller-commissions-lint
    paths:
      - '.github/workflows/seller-final-validation.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/seller-commissions-lint
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Summarize remaining eslint errors
        run: |
          node --input-type=module <<'NODE'
          import { ESLint } from 'eslint';
          import { writeFileSync } from 'node:fs';
          const eslint = new ESLint();
          const results = await eslint.lintFiles(['.']);
          const rules = new Map();
          const samples = [];
          let errors = 0;
          let warnings = 0;
          for (const result of results) {
            errors += result.errorCount;
            warnings += result.warningCount;
            for (const message of result.messages) {
              if (message.severity !== 2) continue;
              const key = message.ruleId ?? 'unknown';
              rules.set(key, (rules.get(key) ?? 0) + 1);
              if (samples.length < 40) {
                samples.push({ file: result.filePath.replace(process.cwd() + '/', ''), line: message.line, column: message.column, ruleId: key, message: message.message });
              }
            }
          }
          writeFileSync('.github/seller-eslint-summary.json', JSON.stringify({ errors, warnings, rules: Object.fromEntries(rules), samples }, null, 2));
          NODE
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/seller-eslint-summary.json
          git commit -m "chore: summarize remaining eslint errors"
          git push origin HEAD:fix/seller-commissions-lint
