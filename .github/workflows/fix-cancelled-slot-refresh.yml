name: Fix Cancelled Slot Refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-cancelled-slot-refresh.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply cancellation slot refresh patch
        run: python .github/scripts/fix_cancelled_slot_refresh.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed files
        run: bunx prettier --write src/components/professional-client-booking-tools.tsx src/routes/agendar.tsx src/components/admin-appointments-workspace.tsx

      - name: Lint changed files (diagnostic)
        continue-on-error: true
        run: bunx eslint src/components/professional-client-booking-tools.tsx src/routes/agendar.tsx src/components/admin-appointments-workspace.tsx

      - name: Production build
        run: bun run build

      - name: Commit fix and clean temporary files
        run: |
          rm -f .github/scripts/fix_cancelled_slot_refresh.py .github/workflows/fix-cancelled-slot-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/professional-client-booking-tools.tsx src/routes/agendar.tsx src/components/admin-appointments-workspace.tsx .github/scripts/fix_cancelled_slot_refresh.py .github/workflows/fix-cancelled-slot-refresh.yml
          git commit -m "fix: release cancelled appointment slots in active booking views"
          git push origin HEAD:main
