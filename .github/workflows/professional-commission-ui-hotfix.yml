name: Apply professional commission UI

on:
  push:
    paths:
      - .github/workflows/professional-commission-ui-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply UI patch
        run: python .github/scripts/professional_commission_ui_patch.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed files
        run: bunx prettier --write src/routes/profissional.tsx src/components/finance-staging-workspace.tsx src/components/professional-commission-summary.tsx

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Commit changes and remove temporary patch files
        run: |
          rm -f .github/scripts/professional_commission_ui_patch.py
          rm -f .github/workflows/professional-commission-ui-hotfix.yml
          git config user.name "JR Clinic automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose professional commissions and clarify legacy adjustments"
          git push origin main

# retry: robust professional portal insertion