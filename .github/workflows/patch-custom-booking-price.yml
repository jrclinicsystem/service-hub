name: One-time custom booking price patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-custom-booking-price:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply custom price patch
        run: python .github/scripts/patch_custom_booking_price.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/professional-client-booking-tools.tsx src/components/admin-appointments-workspace.tsx src/routes/admin_.equipe.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Allow custom prices on internal appointments"
            git push origin HEAD:main
          fi
