name: Fix admin sidebar overlap hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_admin_sidebar_overlap_and_add_sellers.py'
      - '.github/workflows/fix-admin-sidebar-overlap-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply sidebar hotfix
        run: python .github/scripts/fix_admin_sidebar_overlap_and_add_sellers.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Commit corrected navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx src/routes/__root.tsx src/admin-navigation.css
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: remove duplicated admin sidebar and add sellers navigation"
          git push origin HEAD:main
