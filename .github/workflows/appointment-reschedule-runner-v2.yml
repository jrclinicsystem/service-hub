name: Appointment reschedule runner v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appointment-reschedule-runner-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply appointment patch
        run: |
          python .github/scripts/appointment_reschedule_pdf_patch.py
          git checkout -- src/components/finance-staging-workspace.tsx
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript diagnostics
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Cleanup temporary files
        run: rm .github/workflows/appointment-reschedule-runner-v2.yml .github/workflows/appointment-reschedule-pdf-runner.yml .github/workflows/appointment-reschedule-pdf-hotfix.yml .github/scripts/appointment_reschedule_pdf_patch.py
      - name: Commit changes
        run: |
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add src/routes/admin.tsx src/components/admin-appointments-workspace.tsx .github/workflows/appointment-reschedule-runner-v2.yml .github/workflows/appointment-reschedule-pdf-runner.yml .github/workflows/appointment-reschedule-pdf-hotfix.yml .github/scripts/appointment_reschedule_pdf_patch.py
          git commit -m "feat: allow editing and rescheduling appointments"
          git push
