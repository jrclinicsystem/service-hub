name: Fix Nested Service FK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-nested-service-fk.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/fix_nested_service_fk.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript diagnostics
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Cleanup temp patch files
        run: rm .github/scripts/fix_nested_service_fk.py .github/workflows/fix-nested-service-fk.yml
      - name: Commit changes
        run: |
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add src/routes/admin.tsx src/components/admin-appointments-workspace.tsx .github/scripts/fix_nested_service_fk.py .github/workflows/fix-nested-service-fk.yml
          git commit -m "fix: use correct nested service relationship"
          git push
