name: One-time client booking integration patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-client-booking:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply client booking patch
        run: python .github/scripts/patch_client_booking_integration.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/auth.tsx src/components/admin-appointments-workspace.tsx src/integrations/supabase/types.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Connect saved clients to admin appointments"
            git push origin HEAD:main
          fi
