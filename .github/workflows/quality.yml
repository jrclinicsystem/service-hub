name: One-time persistent admin navigation patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-admin-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply navigation patch
        run: python .github/scripts/patch_persistent_admin_navigation.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/__root.tsx src/admin-navigation.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Keep admin sidebar persistent across sections"
            git push origin HEAD:main
          fi
