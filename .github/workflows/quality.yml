name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('src/routes/__root.tsx')
          text = root.read_text(encoding='utf-8')

          if '  UserRound,\n' not in text:
              text = text.replace('  Tag,\n} from "lucide-react";', '  Tag,\n  UserRound,\n} from "lucide-react";', 1)

          if 'admin-client-shortcut' not in text:
              anchor = 'className={`admin-sidebar-shortcut admin-team-shortcut${inlineSection === "team" ? " is-active" : ""}`}'
              anchor_index = text.index(anchor)
              button_end = text.index('          </button>', anchor_index) + len('          </button>')
              inserted = '''
          <Link
            to="/admin/disponibilidade"
            className="admin-sidebar-shortcut admin-availability-shortcut"
          >
            <Clock3 className="size-4 shrink-0 opacity-80" />
            <span>Disponibilidade</span>
          </Link>
          <Link
            to="/admin/clientes"
            className="admin-sidebar-shortcut admin-client-shortcut"
          >
            <UserRound className="size-4 shrink-0 opacity-80" />
            <span>Clientes</span>
          </Link>'''
              text = text[:button_end] + inserted + text[button_end:]

          if 'Cadastro e aniversariantes' not in text:
              access_text = '<span><strong>Acessos</strong><small>Administradores e colaboradores</small></span>'
              access_index = text.index(access_text)
              access_button_start = text.rfind('            <button', 0, access_index)
              mobile = '''            <Link to="/admin/disponibilidade" className="admin-mobile-more-option" role="menuitem" onClick={() => setMoreOpen(false)}>
              <span className="admin-mobile-more-option-icon"><Clock3 /></span>
              <span><strong>Disponibilidade</strong><small>Horários específicos por data</small></span>
            </Link>
            <Link to="/admin/clientes" className="admin-mobile-more-option" role="menuitem" onClick={() => setMoreOpen(false)}>
              <span className="admin-mobile-more-option-icon"><UserRound /></span>
              <span><strong>Clientes</strong><small>Cadastro e aniversariantes</small></span>
            </Link>
'''
              text = text[:access_button_start] + mobile + text[access_button_start:]

          root.write_text(text, encoding='utf-8')

          css = Path('src/admin-navigation.css')
          c = css.read_text(encoding='utf-8')
          old = '''  .admin-access-shortcut {
    top: 443px !important;
    bottom: auto !important;
  }

  .admin-finance-shortcut {
    top: 492px !important;
    bottom: auto !important;
  }'''
          new = '''  .admin-availability-shortcut {
    top: 443px !important;
    bottom: auto !important;
  }

  .admin-client-shortcut {
    top: 492px !important;
    bottom: auto !important;
  }

  .admin-access-shortcut {
    top: 541px !important;
    bottom: auto !important;
  }

  .admin-finance-shortcut {
    top: 590px !important;
    bottom: auto !important;
  }'''
          if old in c:
              c = c.replace(old, new, 1)
          elif 'admin-client-shortcut' not in c:
              raise SystemExit('Admin shortcut CSS block not found')
          css.write_text(c, encoding='utf-8')
          PY

      - name: Commit navigation patch
        run: |
          if git diff --quiet; then
            echo "No navigation changes needed"
            exit 0
          fi
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add src/routes/__root.tsx src/admin-navigation.css
          git commit -m "Add clients and availability to admin navigation"
          git push

  validate:
    needs: patch-navigation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Production build
        if: always()
        run: bun run build
