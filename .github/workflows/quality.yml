name: Quality Check

on:
  push:
    branches: [main, finance-staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          echo "$status" > lint-exit.txt
          exit "$status"

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: |
            lint.log
            lint-exit.txt
          if-no-files-found: ignore

      - name: Production build
        if: always()
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: staging-ci-placeholder
        run: bun run build
