name: Quality Check

on:
  push:
    branches: [main, finance-staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "finance-staging" ]; then
            bunx eslint \
              src/components/finance-staging-workspace.tsx \
              src/components/finance-completion-suite.tsx \
              src/routes/admin_.financeiro.tsx \
              src/integrations/supabase/project.ts
          else
            bun run lint
          fi

      - name: Production build
        if: always()
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: staging-ci-placeholder
        run: bun run build
