name: One-time availability booking source patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-availability-booking-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply availability booking patch
        run: python .github/scripts/patch_booking_availability_source.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin-appointments-workspace.tsx src/routes/admin_.equipe.tsx src/routes/admin_.disponibilidade.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unify booking availability across admin flows"
            git push origin HEAD:main
          fi
