name: Fix client document upload

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-client-document-upload-filelist.py'
      - '.github/workflows/fix-client-document-upload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply upload fix
        run: python3 .github/scripts/fix-client-document-upload-filelist.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'jrclinicsystem'
          git config user.email 'jrclinic.system@gmail.com'
          git add src/components/client-profile-dialog.tsx
          git commit -m 'fix: upload client documents reliably'
          git push origin main
