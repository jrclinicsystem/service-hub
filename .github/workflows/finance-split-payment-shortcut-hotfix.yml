name: Finance split payment shortcut hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/finance_split_payment_shortcut_patch.py'
      - '.github/workflows/finance-split-payment-shortcut-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply split payment shortcut patch
        run: python .github/scripts/finance_split_payment_shortcut_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck diagnostics
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Commit UI changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/finance-attendance-completion.tsx src/components/finance-mixed-payment.tsx
          git commit -m 'fix: expose split payment flow in finance'
          git push origin main
