name: Combo service tracking follow-up

on:
  push:
    paths:
      - '.github/scripts/combo_service_tracking_followup.py'
      - '.github/workflows/combo-service-tracking-followup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply follow-up patch
        run: python .github/scripts/combo_service_tracking_followup.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck diagnostics
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Commit follow-up changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin-appointments-workspace.tsx
          if git diff --cached --quiet; then
            echo "No follow-up changes to commit"
            exit 0
          fi
          git commit -m "fix: stabilize combo service controls"
          git push origin main
