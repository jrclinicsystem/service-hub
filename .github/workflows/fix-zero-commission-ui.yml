name: Zero Commission UI Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-zero-commission-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply UI fix
        run: python .github/scripts/fix_zero_commission_ui.py

      - name: Check whitespace
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Commit feature and clean temporary files
        run: |
          rm -f .github/scripts/fix_zero_commission_ui.py .github/workflows/fix-zero-commission-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/finance-staging-workspace.tsx .github/scripts/fix_zero_commission_ui.py .github/workflows/fix-zero-commission-ui.yml
          git commit -m "finance: allow recalculating zero commissions with current rules"
          git push origin HEAD:main
