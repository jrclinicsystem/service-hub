name: Permanent appointment delete hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/permanent_appointment_delete_patch.py'
      - '.github/workflows/permanent-appointment-delete-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply permanent appointment delete patch
        run: python .github/scripts/permanent_appointment_delete_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Commit application changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin-appointments-workspace.tsx
          git commit -m "fix: permanently delete removable appointments"
          git push
