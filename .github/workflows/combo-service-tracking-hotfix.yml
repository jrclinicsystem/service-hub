name: Combo service tracking hotfix

on:
  push:
    paths:
      - '.github/scripts/combo_service_tracking_patch.py'
      - '.github/workflows/combo-service-tracking-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply combo tracking patch
        run: python .github/scripts/combo_service_tracking_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck diagnostics
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Commit combo tracking changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx src/components/admin-appointments-workspace.tsx src/components/finance-attendance-completion.tsx src/components/finance-mixed-payment.tsx src/components/finance-staging-workspace.tsx
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
            exit 0
          fi
          git commit -m "feat: manage service completion inside combos"
          git push origin main
