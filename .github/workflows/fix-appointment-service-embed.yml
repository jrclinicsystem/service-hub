name: Fix appointment service embed
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-appointment-service-embed.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/fix_appointment_service_embed.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: Cleanup temp patch files
        run: rm .github/scripts/fix_appointment_service_embed.py .github/workflows/fix-appointment-service-embed.yml
      - name: Commit changes
        run: |
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add -A
          git commit -m "fix: disambiguate appointment service relationship"
          git push
