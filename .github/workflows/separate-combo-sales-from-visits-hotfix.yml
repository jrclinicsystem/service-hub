name: Separate combo sales from visits hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/separate_combo_sales_from_visits_patch.py'
      - '.github/workflows/separate-combo-sales-from-visits-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply combo sale / visit separation patch
        run: python .github/scripts/separate_combo_sales_from_visits_patch.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck diagnostics
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin-appointments-workspace.tsx src/components/client-profile-dialog.tsx
          git commit -m "feat: separate combo sales from appointment visits"
          git push
