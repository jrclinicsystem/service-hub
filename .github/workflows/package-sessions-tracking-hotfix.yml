name: Package sessions tracking hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/package_sessions_tracking_patch.py'
      - '.github/workflows/package-sessions-tracking-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply package sessions patch
        run: python .github/scripts/package_sessions_tracking_patch.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck diagnostics
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Commit package sessions UI changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx src/components/admin-appointments-workspace.tsx src/components/finance-attendance-completion.tsx src/components/finance-mixed-payment.tsx
          git commit -m "feat: manage paid packages by session"
          git push
