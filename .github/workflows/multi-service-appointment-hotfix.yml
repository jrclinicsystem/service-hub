name: JR Clinic Multi Service Appointment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multi-service-appointment-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/multi_service_appointment_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Cleanup temp patch files
        run: rm .github/scripts/multi_service_appointment_patch.py .github/workflows/multi-service-appointment-hotfix.yml
      - name: Commit changes
        run: |
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add src/components/admin-appointments-workspace.tsx src/routes/admin.tsx .github/scripts/multi_service_appointment_patch.py .github/workflows/multi-service-appointment-hotfix.yml
          git commit -m "feat: allow multiple services per admin appointment"
          git push
