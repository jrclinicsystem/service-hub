name: Mobile appointment dialog fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-appointment-dialog-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/mobile_appointment_dialog_fix.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript diagnostics
        run: bunx tsc --noEmit || true
      - name: Production build
        run: bun run build
      - name: Cleanup temp patch files
        run: rm .github/scripts/mobile_appointment_dialog_fix.py .github/workflows/mobile-appointment-dialog-fix.yml
      - name: Commit changes
        run: |
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add src/components/admin-appointments-workspace.tsx src/components/ui/dialog.tsx .github/scripts/mobile_appointment_dialog_fix.py .github/workflows/mobile-appointment-dialog-fix.yml
          git commit -m "fix: resize appointment dialog for mobile"
          git push
