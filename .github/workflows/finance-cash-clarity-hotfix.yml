name: Finance cash clarity hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/finance_cash_clarity_patch.py'
      - '.github/workflows/finance-cash-clarity-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply finance cash clarity patch
        run: python .github/scripts/finance_cash_clarity_patch.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck diagnostics
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/finance-completion-suite.tsx
          git commit -m "fix: clarify financial result versus physical cash"
          git push
