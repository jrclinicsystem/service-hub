name: JR service admin hotfix

on:
  push:
    paths:
      - '.github/scripts/jr_service_admin_hotfix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply service admin patch
        run: python .github/scripts/jr_service_admin_hotfix.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck diagnostics
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Commit JR service fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx src/components/admin-appointments-workspace.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: service deletion and inactive-service rescheduling"
          git push origin main
