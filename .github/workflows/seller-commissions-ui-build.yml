name: Seller commissions UI build

on:
  push:
    branches:
      - feature/admin-seller-commissions
    paths:
      - '.github/scripts/seller_commissions_ui_patch.py'
      - '.github/workflows/seller-commissions-ui-build.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-seller-commissions

      - name: Apply seller commissions UI patch
        run: python .github/scripts/seller_commissions_ui_patch.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin-appointments-workspace.tsx src/routes/admin.tsx src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: connect seller commissions to appointments"
          git push origin HEAD:feature/admin-seller-commissions
