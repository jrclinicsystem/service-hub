name: Per-service package sessions UI hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/per_service_package_sessions_ui_patch.py'
      - '.github/scripts/per_service_package_sessions_ui_followup.py'
      - '.github/workflows/per-service-package-sessions-ui-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply per-service package sessions UI patch
        run: |
          python .github/scripts/per_service_package_sessions_ui_patch.py
          python .github/scripts/per_service_package_sessions_ui_followup.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck diagnostics
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx src/components/admin-appointments-workspace.tsx src/components/client-profile-dialog.tsx
          git commit -m "fix: manage combo sessions per service"
          git push
