name: Finance expense attachments hotfix

on:
  push:
    paths:
      - '.github/scripts/finance_expense_attachments_patch.py'
      - '.github/workflows/finance-expense-attachments-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply expense attachments patch
        run: python .github/scripts/finance_expense_attachments_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint changed finance workspace
        run: bunx eslint src/components/finance-staging-workspace.tsx
      - name: Production build
        run: bun run build
      - name: Commit finance expense attachments UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/finance-staging-workspace.tsx
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
            exit 0
          fi
          git commit -m "finance: support expense attachments"
          git push origin main
