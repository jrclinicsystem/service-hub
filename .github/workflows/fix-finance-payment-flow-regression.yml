name: Fix finance payment flow regression

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_finance_payment_flow_regression.py'
      - '.github/workflows/fix-finance-payment-flow-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply regression fix
        run: python .github/scripts/fix_finance_payment_flow_regression.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/finance-attendance-completion.tsx src/components/finance-mixed-payment.tsx
          if git diff --cached --quiet; then
            echo 'No UI changes to commit.'
            exit 0
          fi
          git commit -m 'fix: restore finance appointments and split payments'
          git push origin main
