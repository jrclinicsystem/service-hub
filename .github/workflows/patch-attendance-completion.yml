name: One-time attendance completion patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-attendance-completion:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply attendance completion patch
        run: python .github/scripts/patch_attendance_completion.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/profissional.tsx src/components/admin-appointments-workspace.tsx src/routes/admin.tsx src/components/appointment-calendar.tsx src/components/calendar-day-dialog.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add attendance completion and realized revenue flow"
            git push origin HEAD:main
          fi
