name: Receivables paid visibility runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/receivables-paid-visibility-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply receivables patch
        run: python .github/scripts/receivables_paid_visibility_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript diagnostics
        run: bunx tsc --noEmit
        continue-on-error: true
      - name: Production build
        run: bun run build
      - name: Cleanup temporary files
        run: rm -f .github/scripts/receivables_paid_visibility_patch.py .github/workflows/receivables-paid-visibility-runner.yml
      - name: Commit changes
        run: |
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add -A
          git commit -m "finance: hide settled receivables and allow reversal" || exit 0
          git push
