name: Minimize Cancelled Slot Refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/minimize-cancelled-slot-refresh.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore source formatting before slot fix
        run: |
          git show 745a9a21d11203751e382316e0ff08c5683c3c99:src/components/professional-client-booking-tools.tsx > src/components/professional-client-booking-tools.tsx
          git show 745a9a21d11203751e382316e0ff08c5683c3c99:src/routes/agendar.tsx > src/routes/agendar.tsx
          git show 745a9a21d11203751e382316e0ff08c5683c3c99:src/components/admin-appointments-workspace.tsx > src/components/admin-appointments-workspace.tsx

      - name: Apply minimal cancellation refresh patch
        run: python .github/scripts/minimize_cancelled_slot_refresh.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Commit minimal fix and clean temporary files
        run: |
          rm -f .github/scripts/minimize_cancelled_slot_refresh.py .github/workflows/minimize-cancelled-slot-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/professional-client-booking-tools.tsx src/routes/agendar.tsx src/components/admin-appointments-workspace.tsx .github/scripts/minimize_cancelled_slot_refresh.py .github/workflows/minimize-cancelled-slot-refresh.yml
          git commit -m "chore: keep cancelled slot refresh patch minimal"
          git push origin HEAD:main
