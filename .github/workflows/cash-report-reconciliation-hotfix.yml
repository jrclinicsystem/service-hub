name: Cash report reconciliation hotfix

on:
  push:
    paths:
      - '.github/workflows/cash-report-reconciliation-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply cash reconciliation patch
        run: python .github/scripts/cash_report_reconciliation_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/finance-completion-suite.tsx src/components/finance-staging-workspace.tsx
          git commit -m "feat: reconcile reports with daily cash closing"
          git push
