name: One-time home location card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-home-location-card:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply home location card patch
        run: python .github/scripts/add_home_location_card.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/clinic.functions.ts src/routes/index.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add compact clinic location card"
            git push origin HEAD:main
          fi
