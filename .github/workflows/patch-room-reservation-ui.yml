name: Patch room reservation UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-room-reservation-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply room reservation UI patch
        run: python .github/scripts/patch_room_reservation_ui.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/__root.tsx src/routes/profissional.tsx src/admin-navigation.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate room reservations into admin and professional portals"
            git push origin HEAD:main
          fi
