name: Fix client profile modal interaction

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_client_profile_modal_interaction.py'
      - '.github/workflows/fix-client-profile-modal-interaction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply client modal fix
        run: python .github/scripts/fix_client_profile_modal_interaction.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/client-profile-dialog.tsx
          git commit -m "fix: repair client profile modal layering and tabs"
          git push
