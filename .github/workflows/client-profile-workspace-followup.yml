name: Client profile workspace follow-up

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/client_profile_workspace_followup.py'
      - '.github/workflows/client-profile-workspace-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply follow-up patch
        run: python .github/scripts/client_profile_workspace_followup.py
      - name: Apply client page patch
        run: python .github/scripts/client_profile_workspace_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/client-profile-dialog.tsx src/routes/admin_.clientes.tsx
          git commit -m "feat: complete client records workspace"
          git push
