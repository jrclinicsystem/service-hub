name: Apply finance editable settings

on:
  push:
    paths:
      - .github/workflows/finance-edit-actions-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply finance edits
        run: python3 .github/scripts/finance_edit_actions.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed file
        run: bunx prettier --write src/components/finance-staging-workspace.tsx

      - name: Lint changed file
        run: bunx eslint src/components/finance-staging-workspace.tsx

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Commit changes and remove temporary files
        run: |
          git config user.name "JR Clinic automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/finance-edit-actions-hotfix.yml .github/scripts/finance_edit_actions.py
          git add src/components/finance-staging-workspace.tsx supabase/migrations/20260908133000_add_finance_edit_actions.sql
          git commit -m "feat: make finance settings and pending accounts editable"
          git push origin main
