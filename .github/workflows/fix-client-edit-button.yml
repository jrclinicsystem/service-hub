name: One-time client edit fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-client-edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply client edit fix
        run: python .github/scripts/fix_client_edit_button.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin_.clientes.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix client edit flow"
            git push origin HEAD:main
          fi
