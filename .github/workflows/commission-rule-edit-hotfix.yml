name: Apply commission rule edit hotfix

on:
  push:
    paths:
      - .github/workflows/commission-rule-edit-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch commission rule editor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/components/finance-staging-workspace.tsx')
          text = path.read_text()

          state_start = text.index('  const [rule, setRule] = useState({')
          state_end = text.index('\n  });', state_start) + len('\n  });')
          text = (
              text[:state_end]
              + '\n  const [editingRuleId, setEditingRuleId] = useState("");'
              + text[state_end:]
          )

          method_line = '  const methodId = (code: string) => methods.find((row: any) => row.code === code)?.id ?? null;\n'
          helpers = '''

  const resetRuleEditor = () => {
    setEditingRuleId("");
    setRule({
      professional: "",
      type: "percentage",
      value: "",
      base: "net_after_fees",
      effective: fortalezaIso(),
    });
  };

  const editCommissionRule = (currentRule: any) => {
    setEditingRuleId(String(currentRule.id));
    setRule({
      professional: currentRule.professional_id ?? "",
      type: currentRule.commission_type ?? "percentage",
      value:
        currentRule.commission_type === "percentage"
          ? String(currentRule.percentage ?? "")
          : currentRule.commission_type === "fixed_per_patient"
            ? String(currentRule.fixed_amount ?? "")
            : "",
      base: currentRule.calculation_base ?? "net_after_fees",
      effective: fortalezaIso(),
    });
  };
'''
          if method_line not in text:
              raise SystemExit('methodId insertion point not found')
          text = text.replace(method_line, method_line + helpers, 1)

          panel_line = '            <Panel title="Regra de comissão">\n'
          notice = '''              {editingRuleId ? (
                <div className="mb-4 rounded-2xl border border-primary/15 bg-primary-soft/50 px-4 py-3 text-xs text-primary">
                  Editando uma regra existente. A alteração valerá a partir da data escolhida abaixo,
                  preservando o histórico anterior de comissões.
                </div>
              ) : null}
'''
          if panel_line not in text:
              raise SystemExit('commission panel not found')
          text = text.replace(panel_line, panel_line + notice, 1)
          panel_pos = text.index(panel_line)

          save_marker = '                <Button\n                  disabled={busy === "rule"}'
          save_start = text.index(save_marker, panel_pos)
          save_end = text.index('                </Button>', save_start) + len('                </Button>')
          new_save = '''                <div className="flex gap-2">
                  <Button
                    className="flex-1"
                    disabled={busy === "rule"}
                    onClick={() =>
                      run(
                        "rule",
                        async () => {
                          if (!rule.professional) throw new Error("Selecione o profissional.");
                          const value = parseMoney(rule.value || "0");
                          const result = await db.rpc("set_professional_commission_rule", {
                            _professional_id: rule.professional,
                            _commission_type: rule.type,
                            _percentage: rule.type === "percentage" ? value : null,
                            _fixed_amount: rule.type === "fixed_per_patient" ? value : null,
                            _calculation_base: rule.base,
                            _effective_from: rule.effective,
                          });
                          if (result.error) throw result.error;
                          resetRuleEditor();
                        },
                        editingRuleId
                          ? "Regra de comissão atualizada."
                          : "Regra de comissão salva.",
                      )
                    }
                  >
                    {editingRuleId ? "Atualizar regra" : "Salvar regra"}
                  </Button>
                  {editingRuleId ? (
                    <Button
                      variant="outline"
                      disabled={busy === "rule"}
                      onClick={resetRuleEditor}
                    >
                      Cancelar
                    </Button>
                  ) : null}
                </div>'''
          text = text[:save_start] + new_save + text[save_end:]

          filter_marker = '.filter((r: any) => r.is_active && r.effective_to == null)'
          filter_pos = text.index(filter_marker, panel_pos)
          slice_marker = '\n                  .slice(0, 8)'
          slice_pos = text.find(slice_marker, filter_pos, filter_pos + 500)
          if slice_pos != -1:
              text = text[:slice_pos] + text[slice_pos + len(slice_marker):]

          map_start = text.index('                  .map((r: any) => (', filter_pos)
          map_end = text.index('                  ))}', map_start) + len('                  ))}')
          new_map = '''                  .map((r: any) => (
                    <div
                      key={r.id}
                      className="flex items-center justify-between gap-3 rounded-xl border border-border px-3 py-2 text-xs"
                    >
                      <div>
                        <div>
                          {professionals.find((p: any) => p.id === r.professional_id)?.name ||
                            String(r.professional_id).slice(0, 8)}{" "}
                          ·{" "}
                          {r.commission_type === "percentage"
                            ? `${Number(r.percentage)}%`
                            : r.commission_type === "fixed_per_patient"
                              ? `${money(r.fixed_amount)} por paciente`
                              : "Manual"}
                        </div>
                        <div className="mt-1 text-[11px] text-muted-foreground">
                          {r.calculation_base === "net_after_fees"
                            ? "Líquido após taxas"
                            : r.calculation_base === "after_discount"
                              ? "Após desconto"
                              : "Valor original"}{" "}
                          · vigente desde {formatDate(r.effective_from)}
                        </div>
                      </div>
                      <Button size="sm" variant="outline" onClick={() => editCommissionRule(r)}>
                        Editar
                      </Button>
                    </div>
                  ))}'''
          text = text[:map_start] + new_map + text[map_end:]

          path.write_text(text)
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed file
        run: bunx prettier --write src/components/finance-staging-workspace.tsx

      - name: Lint changed file
        run: bunx eslint src/components/finance-staging-workspace.tsx

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          git config user.name "JR Clinic automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/commission-rule-edit-hotfix.yml
          git add src/components/finance-staging-workspace.tsx
          git commit -m "feat: allow editing commission rules"
          git push origin main
