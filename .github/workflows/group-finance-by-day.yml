name: Group finance by day
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/group-finance-by-day.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/group_finance_by_day_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript diagnostics
        run: bunx tsc --noEmit || true
      - name: Production build
        run: bun run build
      - name: Cleanup temp patch files
        run: rm .github/scripts/group_finance_by_day_patch.py .github/workflows/group-finance-by-day.yml
      - name: Commit changes
        run: |
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add src/components/finance-staging-workspace.tsx .github/scripts/group_finance_by_day_patch.py .github/workflows/group-finance-by-day.yml
          git commit -m "finance: group entries and expenses by day"
          git push
