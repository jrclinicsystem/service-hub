name: Client combo session finance fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/client_combo_session_finance_fix.py'
      - '.github/workflows/client-combo-session-finance-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply client combo session finance fix
        run: python .github/scripts/client_combo_session_finance_fix.py

      - name: Keep single attended visits out of finance queue
        run: python -c 'from pathlib import Path; p=Path("src/components/finance-attendance-completion.tsx"); s=p.read_text(); old="      if (sessions.length > 1) return sessions.every((session: any) => session.status === \"completed\");\n      return true;"; new="      if (sessions.length > 1) return sessions.every((session: any) => session.status === \"completed\");\n      return row.status === \"confirmado\";"; assert old in s or new in s, "finance queue anchor not found"; p.write_text(s if new in s else s.replace(old,new,1))'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck diagnostics
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/client-profile-dialog.tsx src/components/admin-appointments-workspace.tsx src/components/finance-staging-workspace.tsx src/components/finance-attendance-completion.tsx
          git commit -m "fix: finalize combo finance session rules"
          git push
