name: Finance accordion and appointment reschedule runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finance-accordion-and-appointment-reschedule-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply finance accordion and reschedule patch
        run: python .github/scripts/finance_accordion_and_appointment_reschedule_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript diagnostics
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Cleanup temporary files
        run: rm -f .github/scripts/finance_accordion_and_appointment_reschedule_patch.py .github/workflows/finance-accordion-and-appointment-reschedule-runner.yml
      - name: Commit changes
        run: |
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add -A
          git commit -m "feat: collapse finance histories and expose appointment rescheduling"
          git push
