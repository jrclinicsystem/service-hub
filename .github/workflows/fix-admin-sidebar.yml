name: Fix admin sidebar links

on:
  push:
    paths:
      - '.github/workflows/fix-admin-sidebar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add client and availability links
        shell: python
        run: |
          from pathlib import Path

          root = Path('src/routes/__root.tsx')
          text = root.read_text(encoding='utf-8')

          if '  UserRound,\n' not in text:
              text = text.replace('  Tag,\n} from "lucide-react";', '  Tag,\n  UserRound,\n} from "lucide-react";', 1)

          client_marker = 'to="/admin/clientes" className="persistent-admin-sidebar-item"'
          if client_marker not in text:
              label = '          <span>Agenda da equipe</span>'
              label_index = text.index(label)
              button_end = text.index('        </button>', label_index) + len('        </button>')
              links = '''

        <Link to="/admin/disponibilidade" className="persistent-admin-sidebar-item">
          <Clock3 className="size-4 shrink-0" />
          <span>Disponibilidade</span>
        </Link>

        <Link to="/admin/clientes" className="persistent-admin-sidebar-item">
          <UserRound className="size-4 shrink-0" />
          <span>Clientes</span>
        </Link>'''
              text = text[:button_end] + links + text[button_end:]

          root.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add src/routes/__root.tsx
          git commit -m "Add clients and availability to main admin sidebar"
          git push
