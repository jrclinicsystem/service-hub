name: Combo payment registration follow-up

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/combo_payment_registration_followup.py'
      - '.github/workflows/combo-payment-registration-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply combo payment registration follow-up
        run: python .github/scripts/combo_payment_registration_followup.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck diagnostics
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/client-profile-dialog.tsx
          git commit -m "feat: register combo payment once in client profile"
          git push
