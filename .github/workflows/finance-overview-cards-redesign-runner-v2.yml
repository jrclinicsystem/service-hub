name: Finance overview cards redesign runner v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finance-overview-cards-redesign-runner-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply finance overview redesign
        run: python .github/scripts/finance_overview_cards_redesign.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript diagnostics
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Cleanup temporary files
        run: rm -f .github/scripts/finance_overview_cards_redesign.py .github/workflows/finance-overview-cards-redesign-runner-v2.yml
      - name: Commit changes
        run: |
          git config user.name "jrclinicsystem"
          git config user.email "jrclinic.system@gmail.com"
          git add -A
          git commit -m "design: reorganize finance overview metrics"
          git push
